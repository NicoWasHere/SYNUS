name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci here (instead of npm install) hits a known npm bug:
      # package-lock.json generated on Windows doesn't reliably carry the
      # Linux-specific optional rollup binary (@rollup/rollup-linux-x64-gnu),
      # so `npm ci`'s strict install fails on this Linux runner even though
      # the same lockfile works fine locally on Windows - see
      # https://github.com/npm/cli/issues/4828. `npm install` re-resolves
      # optional deps for the current platform instead of trusting the
      # lockfile's frozen resolution.
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

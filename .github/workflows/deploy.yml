name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # package-lock.json was generated on Windows, and its recorded
      # optional-dependency resolution doesn't carry the Linux-specific
      # native rollup binary (@rollup/rollup-linux-x64-gnu) - a well-known
      # npm bug (npm/cli#4828) where the lockfile's platform-specific
      # optional deps don't get recomputed for a different OS, so even a
      # plain `npm install` still trusts the (wrong-platform) lockfile and
      # fails identically to `npm ci`. Rollup's own error message names
      # the fix directly: delete package-lock.json (there's no
      # node_modules to also delete - checkout never creates one) so this
      # install recomputes the dependency tree from package.json's semver
      # ranges instead, correctly picking Linux's own optional binaries.
      - run: rm -f package-lock.json && npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
